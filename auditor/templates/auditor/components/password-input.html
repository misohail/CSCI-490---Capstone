<label for="password">Password</label>

<div class="inputrow">
    <input
        id="password"
        type="password"
        maxlength="128"
        autocomplete="off"
        spellcheck="false"
        placeholder="Enter a password"
    >
    <button id="toggle" type="button">Show</button>
</div>

<small>The plaintext password stays in this browser.</small>
